# PostgreSQL + pgvector + FastAPI Backend + React Frontend
#
# Usage:
#   Full Stack:    docker compose up -d --build
#   Database only: docker compose up -d db
#   Stop:          docker compose down
#   Wipe:          docker compose down -v
#
# Access points:
#   Frontend Dashboard:  http://localhost:3000
#   Backend API Docs:    http://localhost:8000/docs
#   Postgres (pgvector): localhost:5432

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: revrec_db
    environment:
      POSTGRES_USER: revrec
      POSTGRES_PASSWORD: revrec
      POSTGRES_DB: revrec
    ports:
      - "5432:5432"
    volumes:
      - revrec_pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revrec -d revrec"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: revrec_backend
    environment:
      DATABASE_URL: postgresql+psycopg://revrec:revrec@db:5432/revrec
      FRONTEND_ORIGIN: http://localhost:3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: revrec_frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  revrec_pgdata:
